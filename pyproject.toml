[project]
name = "cathode"
version = "0.1.0"
description = "A python terminal UI library for building interactive CLI tools"
authors = [{ name = "Mitchell Goff" }]
requires-python = ">=3.10"

readme = "README.md"
classifiers = ["Programming Language :: Python :: 3"]
license = "MIT"
license-files = ["LICENSE"]

dependencies = []

[project.optional-dependencies]
testing = [
    "ruff",
    "ty",
    "pytest",
    "pre-commit",
    "typing_extensions>=4.0; python_version < '3.11'",
]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"cathode" = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py310"

lint.select = ["ALL"]
lint.ignore = [
    "ARG", "ASYNC", "BLE", "C", "EM", "ERA", "FBT", "PERF", "PLR", "Q", "RET", "RUF", "TC", "TD", "TRY",
    "ANN401", "COM812", "E701", "FIX002", "N802", "PT018", "S101", "S310",
    "D103", "D104", "D105", "D106", "D107",
]
lint.pydocstyle.convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D102"]
